<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cycle of Alignment</title>
    <style>
      :root {
        color-scheme: light dark;
        --angle-step: 36deg;
        --radius: 14rem;
        --node-size: 5.75rem;
        --ring-color: rgba(255, 255, 255, 0.35);
        --indigo: #3730a3;
        --violet: #7c3aed;
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(140deg, var(--indigo), var(--violet));
        color: #fdfbff;
      }

      figure {
        margin: 0;
      }

      .infographic {
        position: relative;
        width: calc(var(--radius) * 2 + var(--node-size));
        height: calc(var(--radius) * 2 + var(--node-size));
        display: grid;
        place-items: center;
        border-radius: 50%;
        padding: 2rem;
        isolation: isolate;
      }

      .background-ring {
        position: absolute;
        inset: 10%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0) 70%);
        opacity: 0.35;
        filter: blur(2px);
      }

      .ring-outline {
        position: absolute;
        inset: 13%;
        border-radius: 50%;
        border: 2px dashed var(--ring-color);
        box-shadow: 0 0 45px rgba(18, 10, 80, 0.35);
      }

      .center {
        position: relative;
        z-index: 2;
        width: 10rem;
        height: 10rem;
        border-radius: 50%;
        display: grid;
        place-items: center;
        gap: 0.4rem;
        text-align: center;
        color: #160b37;
        background: linear-gradient(150deg, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.35));
        border: 1px solid rgba(255, 255, 255, 0.7);
        box-shadow: 0 18px 30px rgba(11, 8, 45, 0.4);
      }

      .center .title {
        letter-spacing: 0.28em;
        font-size: 1.5rem;
        font-weight: 700;
      }

      .center .subtitle {
        font-size: 2.35rem;
        font-weight: 500;
      }

      .nodes {
        position: absolute;
        inset: 0;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .node {
        --angle: calc(var(--index) * var(--angle-step));
        position: absolute;
        top: 50%;
        left: 50%;
        display: grid;
        place-items: center;
        gap: 0.4rem;
        width: var(--node-size);
        height: var(--node-size);
        margin: calc(var(--node-size) / -2);
        padding: 1rem;
        text-align: center;
        border-radius: 50%;
        background: rgba(19, 16, 60, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-shadow: 0 14px 32px rgba(9, 8, 35, 0.45);
        transform: rotate(var(--angle)) translate(var(--radius)) rotate(calc(-1 * var(--angle)));
        transition: transform 250ms ease, box-shadow 250ms ease, background 250ms ease;
      }

      .node::before {
        content: "";
        position: absolute;
        inset: 50% 48% 120%;
        margin: auto;
        width: 2px;
        background: linear-gradient(to bottom, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0));
        transform: rotate(calc(-1 * var(--angle)));
        transform-origin: center top;
        opacity: 0.8;
      }

      .node:hover,
      .node:focus-visible {
        transform: rotate(var(--angle)) translate(calc(var(--radius) + 0.8rem)) rotate(calc(-1 * var(--angle)));
        background: rgba(29, 24, 92, 0.85);
        box-shadow: 0 18px 36px rgba(8, 6, 30, 0.55);
        outline: none;
      }

      .node span {
        display: block;
      }

      .icon {
        font-size: 1.65rem;
      }

      .label {
        font-size: 0.88rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 720px) {
        :root {
          --radius: 9rem;
          --node-size: 5rem;
        }

        .center {
          width: 8rem;
          height: 8rem;
          padding: 1.2rem;
        }

        .center .title {
          font-size: 1.2rem;
        }

        .center .subtitle {
          font-size: 2rem;
        }

        .label {
          font-size: 0.78rem;
        }
      }

      @media (max-width: 520px) {
        body {
          padding: 2rem 1rem;
        }

        :root {
          --radius: 7.25rem;
          --node-size: 4.4rem;
        }

        .icon {
          font-size: 1.4rem;
        }

        .label {
          letter-spacing: 0.04em;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <figure class="infographic" role="img" aria-labelledby="cycle-title">
      <div class="background-ring" aria-hidden="true"></div>
      <div class="ring-outline" aria-hidden="true"></div>
      <figcaption id="cycle-title" class="sr-only">
        Cycle of Alignment infographic illustrating the ALIGNERZ core elements arranged around a circle.
      </figcaption>
      <div class="center">
        <span class="title">ALIGNERZ</span>
        <span class="subtitle">∞</span>
      </div>
      <ol class="nodes" role="list">
        <li class="node" style="--index: 0">
          <span class="icon" aria-hidden="true">🕰️</span>
          <span class="label">Time</span>
        </li>
        <li class="node" style="--index: 1">
          <span class="icon" aria-hidden="true">⏳</span>
          <span class="label">Patience</span>
        </li>
        <li class="node" style="--index: 2">
          <span class="icon" aria-hidden="true">🧭</span>
          <span class="label">Discipline</span>
        </li>
        <li class="node" style="--index: 3">
          <span class="icon" aria-hidden="true">🤝</span>
          <span class="label">Trust</span>
        </li>
        <li class="node" style="--index: 4">
          <span class="icon" aria-hidden="true">🎵</span>
          <span class="label">Rhythm</span>
        </li>
        <li class="node" style="--index: 5">
          <span class="icon" aria-hidden="true">🔁</span>
          <span class="label">Cycle</span>
        </li>
        <li class="node" style="--index: 6">
          <span class="icon" aria-hidden="true">📡</span>
          <span class="label">Signal</span>
        </li>
        <li class="node" style="--index: 7">
          <span class="icon" aria-hidden="true">💎</span>
          <span class="label">Value</span>
        </li>
        <li class="node" style="--index: 8">
          <span class="icon" aria-hidden="true">🌐</span>
          <span class="label">Community</span>
        </li>
        <li class="node" style="--index: 9">
          <span class="icon" aria-hidden="true">2️⃣6️⃣</span>
          <span class="label">26</span>
        </li>
      </ol>
    </figure>
  </body>
</html>
